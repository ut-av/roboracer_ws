name: sim_teleop
# x86_64 only (the Unity simulator). Every GUI pane waits for the vnc pane's
# live :9 server, the same probe as navstack.yaml. NOTE: rviz2, av_sim,
# ut_automata and av_description still inherit the project's Jetson base image,
# so those panes can't build on x86_64 yet.
windows:
  - name: simulator
    layout: main-vertical
    panes:
      - null
      - package: simulator
        # The simulator package's image carries TurboVNC (see rl_ppo.yaml).
        cmd: $HOME/roboracer_ws/scripts/vnc
      - package: simulator
        cmd: $HOME/workspace/src/simulator/scripts/download_sim.sh && until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 $HOME/workspace/src/simulator/simulator/build/linux/sim.x86_64 --scene circuit_launch --port 9999 --host 127.0.0.1 -logfile -
      - package: rviz2
        cmd: while true; do until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done; DISPLAY=:9 vglrun -d egl rviz2; sleep 5; done
      - package: av_sim
        cmd: ros2 run av_sim simulator_bridge
      - package: ut_automata
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 ros2 run ut_automata gui --windowed
      - package: av_description
        cmd: ros2 launch av_description description.launch.py
      - package: ut_automata
        cmd: ros2 run ut_automata joystick
