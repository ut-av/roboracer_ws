name: imitation_inference
windows:
  - name: simulator
    layout: main-vertical
    panes:
      - null
      - package: orin_rp2_csi
        cmd: ros2 run orin_rp2_csi mono_processor --ros-args -p width:=320 -p height:=240 -p framerate:=30 -p display_mode:="none"
      - package: av_imitation
        cmd: sleep 10 && ros2 run av_imitation play --experiment-name ${EXPERIMENT:-20251215_033702_cnn_sidewalk_grey_25min_5hz_h-5s_f-2s}
      - package: ut_automata
        cmd: ros2 run ut_automata vesc_driver --config_dir $HOME/workspace/install/ut_automata/share/ut_automata/config
      - package: ut_automata
        cmd: ros2 run ut_automata joystick
      - package: av_description
        cmd: ros2 launch av_description description.launch.py
      - package: ut_automata
        # Probe for a LIVE X server on :9 (a stale X9 socket from a previous run
        # passes a plain [ -S ... ] file test and Qt apps then crash with "could
        # not connect to display :9"; connect() on a dead socket is refused).
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 ros2 run ut_automata gui
      - package: vnc
        cmd: $HOME/roboracer_ws/scripts/vnc
      - package: rviz2
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 rviz2 -d $HOME/roboracer_ws/rviz2/navstack.rviz
