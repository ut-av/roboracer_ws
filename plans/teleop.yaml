name: teleop
windows:
  - name: simulator
    layout: main-vertical
    panes:
      - null
      - package: orin_rp2_csi
        cmd: ros2 run orin_rp2_csi mono_processor --ros-args -p width:=320 -p height:=240 -p framerate:=30 -p display_mode:="none"
      - package: leg_detector
        cmd: ros2 launch leg_detector leg_detector.launch.py
      - package: ut_automata
        cmd: ros2 launch ut_automata lidar.launch.py
      - package: ut_automata
        cmd: ros2 run ut_automata vesc_driver --config_dir $HOME/workspace/install/ut_automata/share/ut_automata/config
      - package: ut_automata
        cmd: ros2 run ut_automata joystick
      - package: av_description
        cmd: ros2 launch av_description description.launch.py
      - package: foxglove_bridge
        cmd: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
      - package: ut_automata
        # gui is a Qt app; draw it on the car's physical touchscreen — the gdm
        # auto-login Xorg on :0. ut_automata/.air mounts /tmp/.X11-unix (X0
        # socket) and /run/user/2002/gdm (the server's Xauthority cookie).
        # The until-loop covers launch-at-boot races before gdm brings :0 up.
        # No vnc pane needed here anymore; use DISPLAY=:9 + a vnc pane instead
        # to view the gui remotely (see navstack.yaml).
        cmd: until [ -S /tmp/.X11-unix/X0 ]; do sleep 0.5; done && DISPLAY=:0 XAUTHORITY=/run/user/2002/gdm/Xauthority ros2 run ut_automata gui
