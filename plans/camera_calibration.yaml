name: camera_calibration
windows:
  - name: simulator
    layout: main-vertical
    panes:
      - null
      - package: vnc
        cmd: $HOME/roboracer_ws/scripts/vnc
      - package: orin_rp2_csi
        cmd: sleep 10 && ros2 run orin_rp2_csi mono_processor --ros-args -p sensor_id:=${SENSOR_ID:-0} -p display_mode:=none
      - package: ut_automata
        # --no-service-check: orin_rp2_csi's mono_processor loads calibration from
        # $HOME/roboracer_ws/params/cameras/<sensor_id>/calibration.txt and does NOT
        # advertise a set_camera_info service. Without this flag the calibrator aborts
        # at startup ("no camera service available"). We save the result to the tarball
        # and copy it into that file by hand, so the commit-to-driver path is unused.
        # Probe for a LIVE X server on :9 (a stale X9 socket from a previous run
        # passes a plain [ -S ... ] file test and Qt apps then crash with "could
        # not connect to display :9"; connect() on a dead socket is refused).
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 ros2 run camera_calibration cameracalibrator --no-service-check --size 8x6 --square 0.025 image:=/camera_${SENSOR_ID:-0}/image_raw camera:=/camera_${SENSOR_ID:-0}
