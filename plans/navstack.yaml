name: navstack
pre_window: export AIRFIELD_NO_PULL=1
windows:
  - name: simulator
    layout: main-vertical
    panes:
      - null
      - package: orin_rp2_csi
        cmd: ros2 run orin_rp2_csi mono_processor --ros-args -p width:=320 -p height:=240 -p framerate:=30 -p display_mode:="none"
      - package: av_navigation
        cmd: ros2 launch av_navigation navigation.launch.py map:=${MAP:-gdc_3n}
      - package: ut_automata
        cmd: ros2 launch ut_automata lidar.launch.py
      - package: ut_automata
        cmd: ros2 run ut_automata vesc_driver --config_dir $HOME/workspace/install/ut_automata/share/ut_automata/config
      - package: ut_automata
        # joystick does NOT define a --config_dir gflag (only vesc_driver does);
        # passing it makes gflags abort with "unknown command line flag 'config_dir'".
        # joystick reads its (optional) joystick.lua from a hardcoded path and just
        # needs /dev/input/js0, so run it with no extra flags.
        cmd: ros2 run ut_automata joystick
      - package: av_description
        cmd: ros2 launch av_description description.launch.py
      - package: foxglove_bridge
        cmd: ros2 launch foxglove_bridge foxglove_bridge_launch.xml
      - package: ut_automata
        # gui is a Qt app; wait for the vnc pane's display, then target :9
        # (ut_automata/.air mounts /tmp/.X11-unix). Probe for a LIVE X server,
        # not just the socket file: a previous run's X9 socket survives in
        # /tmp/.X11-unix after its server dies, so a plain [ -S ... ] check races
        # the vnc pane's stale-socket cleanup and Qt apps crash with "could not
        # connect to display :9". connect() on a dead socket is refused, so the
        # probe only passes once Xvnc is accepting. Same pattern as rviz2 below.
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 ros2 run ut_automata gui
      - package: vnc
        cmd: $HOME/roboracer_ws/scripts/vnc
      - package: rviz2
        cmd: until python3 -c 'import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect("/tmp/.X11-unix/X9")' 2>/dev/null; do sleep 0.5; done && DISPLAY=:9 rviz2 -d $HOME/roboracer_ws/rviz2/navstack.rviz
